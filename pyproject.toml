[project]
name = "bot-hieu-bieu"
version = "0.1.0"
description = "Telegram Bot for 2D Designer"
requires-python = ">=3.10"
dependencies = [
    "alembic==1.16.5",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.10",
    "pydantic==2.11.9",
    "pydantic-settings==2.10.1",
    "SQLAlchemy==2.0.43",
    "google-genai==0.3.0",
    "fastapi",
    "uvicorn"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["api", "core", "models", "services"]
